version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - quesos-network

  app:
    image: victorbartolome/quesosbartolome:latest
    container_name: webapp
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    expose:
      - "443"
    networks:
      - quesos-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /home/vmuser/certs:/etc/nginx/certs
    depends_on:
      - app
    networks:
      - quesos-network

volumes:
  db_data:

networks:
  quesos-network:
    driver: bridge
